- insert:
    - id: qqnt-chat-export
      name: 'dsh-qqnt-chat-export'
      config:
        # These are defaults. The web UI's Settings page writes overrides to
        # settings.json (see README) and applies them without editing this file.
        # 64-bit Python 3 on PATH, or an absolute path to one. It needs the
        # sqlcipher3 package (`pip install sqlcipher3-wheels`).
        # Empty means "python" on Windows and "python3" on Linux.
        # The web settings page can create a private virtualenv and install
        # sqlcipher3 there (default PyPI or the Tsinghua mirror); it never
        # modifies the system Python.
        pythonPath: ''
        # Holds key.txt, the decrypted database copies, and index.sqlite.
        # Empty means %TEMP%\qqnt-chat-export on Windows and
        # $TMPDIR/qqnt-chat-export (usually /tmp) on Linux.
        # Delete it after exporting.
        workDir: ''
        # Empty means %USERPROFILE%\Documents\Tencent Files on Windows and
        # $XDG_CONFIG_HOME/QQ (usually ~/.config/QQ) on Linux.
        tencentRoot: ''
        # QQ number to use when the client holds several accounts. Empty means
        # the account with the largest message database.
        account: ''
        # Local browsing UI on http://127.0.0.1:46728. Set 0 to turn it off.
        # The Settings page can change this at runtime (a new port is
        # bind-tested before the old listener is closed).
        webPort: 46728
        # Loopback only. Do not widen this: the page shows every chat.
        webHost: '127.0.0.1'
        # Which installer the one-click environment setup uses:
        # auto = uv when installed, otherwise venv + pip; uv = only uv;
        # pip = only venv + pip. uv is never downloaded for the user.
        installer: auto
        # Path to the uv executable. Empty means "uv" on PATH.
        uvPath: ''
        # Python version uv fetches for the private environment.
        pythonVersion: '3.12'
