<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 聊天记录</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/app/css/base.css">
</head>
<body>
<header class="app-header">
  <h1>QQ 聊天记录</h1>
  <p class="meta" id="app-meta">正在读取索引状态…</p>
  <span class="app-status" id="app-status"></span>
  <nav class="app-nav">
    <button type="button" class="ghost" id="syncBtn" title="重新复制 QQ 数据库并重建索引">从 QQ 同步</button>
    <button type="button" class="ghost" id="refreshBtn">刷新</button>
    <label class="chat-search-label" title="切换账号索引（切换后自动增量更新）">账号
      <select id="accountSelect" class="account-select"></select>
    </label>
    <button type="button" class="ghost" id="viewChats">会话</button>
    <button type="button" class="ghost" id="viewExport">导出</button>
    <button type="button" class="ghost" id="viewStats">统计</button>
    <button type="button" class="ghost" id="viewAsk">问答</button>
    <button type="button" class="ghost" id="ocrBtn" title="识别已下载的截图里的文字">识别图片文字</button>
    <button type="button" class="ghost" id="asrBtn" title="转写已下载的语音消息">转写语音</button>
    <button type="button" class="ghost" id="viewSettings">设置</button>
    <button type="button" class="ghost" id="viewModels">模型与组件</button>
  </nav>
</header>
<main class="app-main" id="app-main"></main>
<script type="module" src="/app/js/app.js"></script>
</body>
</html>
