name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Both backends must keep importing and probing: Win32 via ctypes,
        # Linux via /proc and the ptrace-scope check.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node syntax
        run: |
          node --check index.js
          node --check web.js
          node --check settings.js
          node --check storage.js

      - name: Inline page script syntax
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('page.html','utf8');const m=html.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('page.html has no inline script');fs.writeFileSync('page-inline.js',m[1]);"
          node --check page-inline.js
          rm page-inline.js

      - name: Python syntax
        run: python -m py_compile scripts/qqnt_export.py scripts/qqnt_query.py

      # The incremental-build tests need SQLCipher to open their synthetic
      # database; without it they skip, so a missing wheel must not fail CI.
      - name: SQLCipher test dependency
        run: python -m pip install --disable-pip-version-check sqlcipher3-wheels || echo "sqlcipher3 unavailable; encrypted tests will skip"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs

      # Running `info` loads the platform backend and enumerates processes;
      # `status` opens the query layer without needing sqlcipher3.
      - name: Runtime smoke test
        run: |
          python scripts/qqnt_export.py info
          python scripts/qqnt_query.py --work "${RUNNER_TEMP}/qqnt-smoke" status

      - name: JSON manifests
        run: |
          node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); } console.log('json ok')"

      # A UTF-8 BOM makes package.json invalid JSON and breaks bundle installation.
      - name: No byte-order marks
        run: |
          python - <<'PY'
          import pathlib
          import sys

          suffixes = {'.json', '.md', '.yml', '.js', '.py', '.html'}
          bad = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix in suffixes or path.name in {'LICENSE', 'NOTICE'}:
                  if path.read_bytes().startswith(b'\xef\xbb\xbf'):
                      bad.append(str(path))
          if bad:
              print('UTF-8 BOM found in: ' + ', '.join(sorted(bad)))
              sys.exit(1)
          print('no byte-order marks')
          PY

      - name: Manifest and bundle patch
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const patch=pkg.dsh&&pkg.dsh.bundle&&pkg.dsh.bundle.patch;if(!patch||!fs.existsSync(patch))throw new Error('dsh.bundle.patch is missing or points at nothing');const yaml=fs.readFileSync(patch,'utf8');if(!yaml.includes(\"name: '\"+pkg.name+\"'\"))throw new Error('patch does not insert ' + pkg.name);for (const f of ['index.js','web.js','settings.js','storage.js','scripts/qqnt_export.py','scripts/qqnt_query.py','page.html']) { if (!fs.existsSync(f)) throw new Error('missing ' + f); } for (const f of ['settings.js','storage.js']) { if (!pkg.files.includes(f)) throw new Error('package.json files lacks ' + f); } for (const os of ['win32','linux']) { if (!pkg.os || !pkg.os.includes(os)) throw new Error('package.json os lacks ' + os); } console.log('manifest ok')"

      - name: Icon size
        run: |
          node -e "const fs=require('fs');const size=fs.statSync('icon.svg').size;if(size>256*1024)throw new Error('icon.svg exceeds 256 KiB');console.log('icon', size, 'bytes')"
